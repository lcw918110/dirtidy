<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dirtidy 审阅</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header>
    <h1>dirtidy</h1>
    <p id="meta"></p>
  </header>
  <section class="toolbar">
    <label>Run
      <select id="runSelect"></select>
    </label>
    <button id="reloadBtn" type="button">刷新</button>
    <button id="saveBtn" type="button">保存决策</button>
    <button id="applyBtn" type="button">执行决策</button>
  </section>
  <section>
    <h2>待自动隔离（规则命中）</h2>
    <p class="hint">
      勾选「保留」的项本轮不会被隔离，并登记进 protection.json 便于审计追溯。
    </p>
    <table>
      <thead>
        <tr>
          <th>保留</th>
          <th>路径</th>
          <th>命中规则</th>
          <th>类型</th>
          <th>原因</th>
        </tr>
      </thead>
      <tbody id="pendingRows"></tbody>
    </table>
    <button id="applyRulesBtn" type="button">执行自动隔离</button>
  </section>
  <section>
    <h2>候选 / 建议</h2>
    <table>
      <thead>
        <tr>
          <th>路径</th>
          <th>来源</th>
          <th>建议</th>
          <th>决策</th>
          <th>归档相对路径</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
  <section>
    <h2>重复组（人选保留）</h2>
    <div id="dups"></div>
  </section>
  <section>
    <h2>受保护（不会被自动隔离）</h2>
    <p class="hint">内置保护清单写在代码里，规则包关不掉；下面是本轮实际拦下的项。</p>
    <div id="protection"></div>
  </section>
  <section>
    <h2>已隔离</h2>
    <div id="quarantined"></div>
  </section>
  <dialog id="explainDlg">
    <div class="dlg-head">
      <strong>为什么？</strong>
      <code id="explainPath"></code>
      <button id="explainClose" type="button">关闭</button>
    </div>
    <pre id="explainBody"></pre>
  </dialog>
  <pre id="status"></pre>
  <script src="/static/app.js"></script>
</body>
</html>
