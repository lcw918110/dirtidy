# 复制为 models.yaml 后填写。勿将含密钥的文件提交入库。
provider: openai_compatible  # 或 ollama

openai_compatible:
  base_url: "https://api.openai.com/v1"
  api_key_env: "DIRTIDY_API_KEY"
  model: "gpt-4o-mini"

ollama:
  host: "http://127.0.0.1:11434"
  model: "llama3.2"

summary:
  max_text_chars: 800
  redact_path: false
  allow_external_content: false
  allow_ollama_full_content: false
  batch_size: 20
  # 非候选文件只保留前 max_depth 层，控制 token 成本
  max_depth: 3
  # 单次 analyze 最多外发多少条：T 级目录下「全量发给模型」既慢又贵，超出会告警
  max_targets: 500
