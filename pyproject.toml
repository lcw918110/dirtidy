[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dirtidy"
version = "0.1.0"
description = "Cross-platform local directory tidy: rule quarantine, hash candidates, AI-assisted review"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "pyyaml>=6.0",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]
# 托盘图标是桌面壳的**可选增强**：不装也能用（降级为 Ctrl-C 退出），
# 但文档既然承诺「装了 pystray 就有托盘」，这个 extra 就必须真实存在。
desktop = ["pystray>=0.19", "Pillow>=10"]

[project.scripts]
dirtidy = "dirtidy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dirtidy = ["web/static/*", "rules/packs/*.yaml", "configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src/dirtidy"]
